<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Agentic App Harness - Portfolio Showcase Hub</title>
    <meta name="description" content="A spec-driven harness that keeps AI coding agents honest across six deployed apps: contract-first Zod schemas, BDD unit and E2E tests, and accessibility gates enforced in CI rather than documented." />

    <!-- Link previews. The hub is a client-rendered SPA, so a crawler that does
         not execute JavaScript sees only the empty #root div — without these,
         sharing the URL yields a bare, image-less card. The image is served
         from raw.githubusercontent.com because .github/screenshots/ ships with
         the repo but is not part of the built Pages artifact. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agentic App Harness" />
    <meta property="og:title" content="Agentic App Harness - Portfolio Showcase Hub" />
    <meta property="og:description" content="A spec-driven harness that keeps AI coding agents honest across six deployed apps: contract-first Zod schemas, BDD unit and E2E tests, and accessibility gates enforced in CI rather than documented." />
    <meta property="og:url" content="https://jf1shh.github.io/agentic-app-harness/" />
    <meta property="og:image" content="https://raw.githubusercontent.com/jf1shh/agentic-app-harness/master/.github/screenshots/portfolio-hub.png" />
    <meta property="og:image:alt" content="The Agentic App Harness portfolio hub dashboard, listing the showcase apps alongside live loop stats and harness status." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Agentic App Harness - Portfolio Showcase Hub" />
    <meta name="twitter:description" content="A spec-driven harness that keeps AI coding agents honest across six deployed apps: contract-first Zod schemas, BDD unit and E2E tests, and accessibility gates enforced in CI rather than documented." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/jf1shh/agentic-app-harness/master/.github/screenshots/portfolio-hub.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
