version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # .agents/AGENTS.md §6 "A Dependency Bump Is Only Safe If Its Peers Move
      # With It": a lone major bump of the compiler or linter has twice taken
      # this repo's CI red — TypeScript 7 and ESLint 10 both land ahead of
      # what typescript-eslint (and this repo's plugin pairings) support.
      # Patch/minor stay automatic; a major needs a deliberate, whole-peer-set
      # PR, not a routine Dependabot bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

