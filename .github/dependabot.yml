version: 2
updates:
  # No root `directory: "/"` npm entry, deliberately. For an npm workspace,
  # Dependabot's root directive auto-expands to every workspace member —
  # which duplicates the six per-app entries below rather than adding
  # coverage. Verified, not assumed: a prior root entry produced PRs like
  # "bump next from 16.3.0 to 16.3.1" touching elder-care-planner,
  # smart-recipe-app, and travel-packing-app's package.json in one PR, while
  # each of those apps' own per-app entry opened an *identical* PR for the
  # same file. Removing the root entry loses proposals only for the root
  # package.json's own narrow devDependency (onnxruntime-web) and the
  # `overrides` block (sharp, adm-zip, xcode>uuid) — those move rarely and
  # deliberately (the overrides exist for CVE patches, see PR #182/#278) and
  # are easy to track by hand; that's a small trade against eliminating
  # duplicate PRs across five dependency families and all six apps.
  #
  # 2026-10-14 (owner: run clean, no backlog): the six per-app entries became one
  # entry with `directories`, so limits and groups are shared. Routine minor and
  # patch bumps land as one grouped PR per app per week, and
  # dependabot-automerge.yml merges those once CI passes. Major version bumps
  # get no routine PRs (security updates still arrive); take majors deliberately.
  - package-ecosystem: "npm"
    directories:
      - "/projects/mood-diner"
      - "/projects/portfolio-hub"
      - "/projects/travel-packing-app"
      - "/projects/smart-recipe-app"
      - "/projects/legal-financial-rag"
      - "/projects/elder-care-planner"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security-minor-patch:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
