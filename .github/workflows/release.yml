name: App Release (tagged)

# Cut an independent, versioned release for a SINGLE app by pushing a tag shaped
# `<app>-v<version>`, e.g. `elder-care-planner-v1.2.0` or `mood-diner-v0.3.1`.
# Only that one app is built and published, so the six apps release on fully
# independent cadences with no monorepo-wide version lockstep — the same
# motivation as the per-app android-release-<app>.yml workflows, for the web
# artifacts. This does not fight the workspace: deps still resolve against the
# single root lockfile (npm workspaces), exactly as ci.yml and deploy-pages.yml
# do. It is one file rather than six because, unlike the android bundles, a web
# release carries no per-app signing secrets to justify separate workflows — the
# app is resolved from the tag instead.
#
# Manual runs are supported via workflow_dispatch (pick the app + version) for a
# release cut without pushing a tag first.

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      app:
        description: 'App to release (must match a projects/<app> directory)'
        required: true
      version:
        description: 'Version label, e.g. v1.2.0'
        required: true

permissions:
  contents: write # create the GitHub Release (and its tag on a manual run)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve and validate release metadata
        id: meta
        env:
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-metadata.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          # Root lockfile: one npm workspace install resolves this app's deps.
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm install

      - name: Build selected app
        env:
          RELEASE_APP: ${{ steps.meta.outputs.app }}
        run: |
          cd "projects/$RELEASE_APP"
          npm run build

      - name: Package build output
        id: pkg
        env:
          RELEASE_APP: ${{ steps.meta.outputs.app }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_OUT: ${{ steps.meta.outputs.out }}
        run: |
          DIR="projects/$RELEASE_APP/$RELEASE_OUT"
          test -d "$DIR"
          ARCHIVE="$RELEASE_APP-$RELEASE_VERSION.zip"
          (cd "$DIR" && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" .)
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_ARCHIVE: ${{ steps.pkg.outputs.archive }}
          RELEASE_APP: ${{ steps.meta.outputs.app }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ARCHIVE" \
            --title "$RELEASE_APP $RELEASE_VERSION" \
            --target "$GITHUB_SHA" --generate-notes
