name: SDD Sentinel (Spec & Quality Gate)

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  sdd-agent-review:
    name: SDD Spec & Quality Sentinel Audit
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: projects/legal-financial-rag/package-lock.json

      # The harness gates (self-test, learn, verify) and validate-specs are static
      # analyzers — no install needed. Only the RAG retrieval-precision gate needs
      # deps (promptfoo + zod), so install just that one app. The full per-app test
      # suite runs in parallel in the Harness Testing Suite workflow (ci.yml) — this
      # job deliberately does not duplicate it.
      - name: Install RAG eval dependencies
        shell: pwsh
        run: |
          Push-Location projects/legal-financial-rag
          npm install --include=dev
          Pop-Location

      - name: Harness Guardrail Self-Test (verify the verifier)
        shell: pwsh
        run: node .\scripts\harness-status.test.mjs

      - name: Harness Learn Gate (Lesson <-> Guardrail traceability)
        shell: pwsh
        run: node .\scripts\harness-learn.mjs

      - name: Harness Verify Gate (blocks on guardrail regressions & missing specs)
        shell: pwsh
        run: node .\scripts\harness-status.mjs --gate

      - name: RAG Retrieval-Precision Gate (LexiVault, deterministic/no-LLM)
        shell: pwsh
        run: node .\scripts\rag-eval-gate.mjs

      - name: Run Spec & Schema Coverage Audit
        shell: pwsh
        run: .\scripts\validate-specs.ps1 -Strict

      - name: Post SDD Sentinel PR Review Comment
        if: success() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `### 🤖 SDD Sentinel — Spec & Quality Gate Report

            ✅ **All required spec & quality gates passed on this PR.**
            - **Spec & schema coverage audit** (\`validate-specs.ps1 -Strict\`): every app has a spec, README, contract-first Zod schemas, and BDD \`Given-When-Then\` E2E specs. Strict mode fails the run on any gap.
            - **Harness gates**: guardrail self-test, Lesson⇄Guardrail traceability (\`learn\`), and the blocking \`verify\` gate all passed.
            - **RAG retrieval-precision gate**: LexiVault's hybrid search met the precision@K and MRR floors on the golden query set (deterministic, no LLM).

            *The full per-app suite (lint, type-check, Vitest, Playwright + \`@axe-core\`) runs in parallel in the Harness Testing Suite workflow.*

            *Automated SDD Sentinel comment for PR #${context.issue.number}.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
