name: SDD Sentinel (Spec & Quality Gate)

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  sdd-agent-review:
    name: SDD Spec & Quality Sentinel Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # The blast-radius gate diffs the PR head against its merge base, which
          # a shallow clone cannot compute. The other steps are static analyzers
          # and do not care either way.
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          # Root lockfile: the repo is an npm workspace (root package.json,
          # projects/*), so the install below resolves against the single
          # root lockfile regardless of its working directory.
          cache-dependency-path: package-lock.json

      # The harness gates (self-test, learn, verify) and validate-specs are static
      # analyzers — no install needed. Only the RAG retrieval-precision gate needs
      # deps (promptfoo + zod), so install just that one app. The full per-app test
      # suite runs in parallel in the Harness Testing Suite workflow (ci.yml) — this
      # job deliberately does not duplicate it.
      - name: Install RAG eval dependencies
        shell: pwsh
        run: |
          Push-Location projects/legal-financial-rag
          npm install --include=dev
          Pop-Location

      - name: Harness Guardrail Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/harness-status.test.mjs

      - name: Blast-Radius Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-enum-blast-radius.test.mjs

      - name: Doc-Claims Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-doc-claims.test.mjs

      - name: Guardrail-Integrity Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-guardrail-integrity.test.mjs

      - name: Harness History Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/harness-history.test.mjs

      - name: Secret-Scanning Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-secrets.test.mjs

      # test-app.mjs is the authoritative per-app gate (ci.yml runs the full
      # suite with no --changed). Its --changed diff-to-app mapping is the only
      # pure logic in it and is never exercised by ci.yml, so it gets the same
      # "verify the verifier" treatment as the other gates.
      - name: Test-App Self-Test (verify the --changed mapping)
        shell: pwsh
        run: node ./scripts/test-app.test.mjs

      - name: Loop-Stats Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-loop-stats.test.mjs

      - name: Peer-Consistency Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-peer-consistency.test.mjs

      - name: Containment Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-containment.test.mjs

      - name: Diff-Size Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-diff-size.test.mjs

      - name: Instruction-Tamper Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-instruction-tamper.test.mjs

      - name: Spec-Ordering Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-spec-ordering.test.mjs

      - name: README-Freshness Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-readme-freshness.test.mjs

      - name: Dependency-Audit Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/check-dependency-audit.test.mjs

      - name: Git-Hooks Installer Self-Test (verify the verifier)
        shell: pwsh
        run: node ./scripts/install-git-hooks.test.mjs

      # Blocks a PR that widens a z.enum without opening every consumer of the
      # inferred type (.agents/AGENTS.md §9.2). The PR body is passed in because
      # naming a file in the blast-radius table counts as handling it — "no
      # change needed, because ..." stays a legitimate answer.
      - name: Blast-Radius Gate (widened types must visit their consumers)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ./scripts/check-enum-blast-radius.mjs --base origin/${{ github.base_ref }} --head HEAD

      # "Who guards the guards": blocks a PR that deletes a guardrail, shrinks a
      # gate self-test's assertion count, or otherwise edits gate logic without
      # saying so in the PR body. A pure net-addition of a new guardrail (the
      # sanctioned §8 workflow) passes silently — see check-guardrail-integrity.mjs
      # header for the full HARD/SOFT rule split.
      - name: Guardrail-Integrity Gate (the gates can't be weakened silently)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ./scripts/check-guardrail-integrity.mjs --base origin/${{ github.base_ref }} --head HEAD

      # Blocks a PR that introduces a high-confidence credential pattern
      # (Anthropic/OpenAI/Google/xAI/AWS/GitHub/Slack keys, PEM private-key
      # blocks) on a line it added — see check-secrets.mjs's header for why
      # this stayed unwired until now and why there is no PR-body escape
      # hatch, unlike the two gates above.
      - name: Secret-Scanning Gate (no committed credentials on added lines)
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: node ./scripts/check-secrets.mjs --base origin/${{ github.base_ref }} --head HEAD

      # Blocks a PR that touches harness infrastructure (scripts/*.mjs,
      # .agents/AGENTS.md, CLAUDE.md, CI workflows, git hooks, spec templates)
      # without naming the file in the PR body or using a
      # [containment-override: path] marker — see check-containment.mjs header.
      - name: Containment Gate (harness infra touches must be acknowledged)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ./scripts/check-containment.mjs --base origin/${{ github.base_ref }} --head HEAD

      # Blocks a PR whose net changed lines (excluding generated/lock files)
      # exceed 800 without a [large-diff-acknowledged] marker in the PR body —
      # warns at 400. See check-diff-size.mjs header for the threshold rationale.
      - name: Diff-Size Gate (large diffs must be acknowledged)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ./scripts/check-diff-size.mjs --base origin/${{ github.base_ref }} --head HEAD

      # Non-blocking sensor: detects when an agent PR subtly weakens a prose
      # rule in instruction files (removes MUST/NEVER/always/mandatory/blocking/
      # required) or adds gate-bypass patterns (--no-verify, continue-on-error:
      # true, if: false) to workflows. Informational only — exits 0 always.
      # Promote to blocking once the false-positive rate is understood.
      - name: Instruction-Tamper Sensor (rule weakening / gate bypass detection)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        run: node ./scripts/check-instruction-tamper.mjs --base origin/${{ github.base_ref }} --head HEAD

      # Non-blocking sensor: flags apps where logic modules changed without
      # a matching spec touch or test file touch. Approximates fspec's
      # machine-checked spec→test→code ordering. PR body [spec-unchanged:
      # reason] silences the finding for legitimate bugfixes.
      - name: Spec-Ordering Sensor (logic changes should touch spec or tests)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ./scripts/check-spec-ordering.mjs --base origin/${{ github.base_ref }} --head HEAD

      # Non-blocking sensor: flags PRs where app source or harness infra
      # changed without a corresponding README update. §7 and §10.2
      # require README updates when features change. PR body
      # [readme-unchanged: reason] silences the finding.
      - name: README-Freshness Sensor (source changes should update READMEs)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node ./scripts/check-readme-freshness.mjs --base origin/${{ github.base_ref }} --head HEAD

      # Non-blocking sensor: runs `npm audit --json` once against the shared
      # root lockfile (works from the lockfile alone, no install needed) and
      # prints every advisory in one place. Not gated on the PR event, unlike
      # the diff-shaped sensors above — a lockfile-wide advisory can appear
      # with no lockfile change in this PR at all, if a new CVE was published
      # against a version already pinned. See check-dependency-audit.mjs's
      # header for why 11 real advisories went unnoticed before this existed.
      - name: Dependency-Audit Sensor (known vulnerabilities in the resolved tree)
        continue-on-error: true
        shell: pwsh
        run: node ./scripts/check-dependency-audit.mjs

      - name: Harness Learn Gate (Lesson <-> Guardrail traceability)
        shell: pwsh
        run: node ./scripts/harness-learn.mjs

      # Read-only and non-blocking: prints promotion candidates / never-fired
      # guardrails from harness-history.json into the PR's CI log for
      # visibility. Recording a new snapshot (--record) is a separate, opt-in
      # step a human or agent runs and commits deliberately — see
      # .agents/AGENTS.md §8, "Making Learn data-driven".
      - name: Harness History Report (informational — promotion candidates / never-fired guardrails)
        shell: pwsh
        run: node ./scripts/harness-history.mjs

      - name: Harness Verify Gate (blocks on guardrail regressions & missing specs)
        shell: pwsh
        run: node ./scripts/harness-status.mjs --gate

      # Posts every guardrail hit as an inline PR review comment, on the exact
      # line it fired on — see scripts/harness-status-rdjson.mjs's header for
      # why: it's the §9.1 "never self-certify verification" rule applied to
      # the gate's own output, so there's nothing left for a PR body to
      # mis-summarize. `if: always()` so a failing Verify Gate above still
      # gets annotated (that's the case this is most useful for); reviewdog's
      # own `-filter-mode=added` means only findings on lines this PR actually
      # touched get posted, so a pre-existing hit elsewhere in the repo isn't
      # re-litigated on every unrelated PR. Purely additive/informational —
      # `continue-on-error: true` so reviewdog itself can never block a merge;
      # the Verify Gate step above is the actual gate.
      - name: Setup reviewdog
        if: always() && github.event_name == 'pull_request'
        uses: reviewdog/action-setup@v1

      - name: Annotate PR with guardrail findings (reviewdog, informational)
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node ./scripts/harness-status-rdjson.mjs | \
            reviewdog -f=rdjsonl -name=harness-status -reporter=github-pr-review -filter-mode=added -fail-level=none

      # §9.1 says "never self-certify verification" for PR bodies; this is the same
      # rule applied to the docs themselves — a checked-in claim like "7 guardrails"
      # must match what the code it describes actually contains.
      - name: Doc-Claims Gate (checked-in docs must match what they claim)
        shell: pwsh
        run: node ./scripts/check-doc-claims.mjs --gate

      # The rulebook's lesson count is load-bearing data: blocks a PR that
      # changes .agents/AGENTS.md or scripts/harness-status.mjs without
      # regenerating portfolio-hub's committed loop-stats fixture, failing fast
      # with the regenerate command instead of a cryptic `expected 47 to be 46`
      # unit-test failure in the per-app leg (.agents/AGENTS.md §6).
      - name: Loop-Stats Gate (committed loop stats must match the rulebook)
        shell: pwsh
        run: node ./scripts/check-loop-stats.mjs

      # File-shaped like the gate above, not diff-shaped: reads the six
      # projects/*/package.json files as they stand right now and blocks a
      # split react/react-dom (or @types/*, or @typescript-eslint plugin/
      # parser) major within one app, or a split @typescript-eslint major
      # across apps that share an eslint major — the exact npm-install and
      # workspace-hoisting failures in .agents/AGENTS.md §6. It deliberately
      # never flags apps on different major versions from each other, since
      # this repo's apps are independently versioned by design.
      - name: Peer-Consistency Gate (shared devDependency peers must move together)
        shell: pwsh
        run: node ./scripts/check-peer-consistency.mjs

      - name: RAG Retrieval-Precision Gate (LexiVault, deterministic/no-LLM)
        shell: pwsh
        run: node ./scripts/rag-eval-gate.mjs

      - name: Run Spec & Schema Coverage Audit
        shell: pwsh
        run: ./scripts/validate-specs.ps1 -Strict

      # Purely informational: posts a "gates passed" summary comment. It runs
      # AFTER every actual gate above, so a failure here means the gates already
      # passed — a transient GitHub API 503 on this createComment call must not
      # red the required Sentinel check (it did, on PR #236). `continue-on-error`
      # matches the reviewdog annotation step above, which is non-blocking for
      # the same reason; `retries` lets github-script ride out a brief blip
      # (503 is not in its retry-exempt list) so the comment usually still posts.
      - name: Post SDD Sentinel PR Review Comment
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const body = `### 🤖 SDD Sentinel — Spec & Quality Gate Report

            ✅ **All required spec & quality gates passed on this PR.**
            - **Spec & schema coverage audit** (\`validate-specs.ps1 -Strict\`): every app has a spec, README, contract-first Zod schemas, and BDD \`Given-When-Then\` E2E specs. Strict mode fails the run on any gap.
            - **Harness gates**: guardrail self-test, Lesson⇄Guardrail traceability (\`learn\`), the blocking \`verify\` gate, the doc-claims gate (checked-in docs match what they claim), the guardrail-integrity gate (the gates themselves weren't silently weakened), the secret-scanning gate (no committed credentials on added lines), the containment gate (harness infrastructure touches are acknowledged), the diff-size gate (large diffs are acknowledged), and the peer-consistency gate (no split react/react-dom, @types/*, or @typescript-eslint plugin/parser majors, within an app or across apps sharing an eslint major) all passed.
            - **Non-blocking sensors**: instruction-tamper sensor (detects rule weakening and gate bypass in instruction/workflow files) and spec-ordering sensor (flags logic changes without a matching spec or test touch) ran as informational checks.
            - **RAG retrieval-precision gate**: LexiVault's hybrid search met the precision@K and MRR floors on the golden query set (deterministic, no LLM).

            *The full per-app suite (lint, type-check, Vitest, Playwright + \`@axe-core\`) runs in parallel in the Harness Testing Suite workflow.*

            *Automated SDD Sentinel comment for PR #${context.issue.number}.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  # sdd-agent-review above checks structure — specs exist, docs match reality, no unpinned
  # deps, no secrets, no widened enum left unvisited. It does not read the diff for logic bugs,
  # edge cases, or security issues in the code itself. This job is that missing semantic layer,
  # scoped to the same repo-specific knowledge sdd-agent-review already enforces structurally:
  # it points Claude at .agents/AGENTS.md §6 and the lessons it indexes under .agents/lessons/ —
  # this repo's own catalog of real shipped bugs — so the review checks new diffs against
  # documented failure patterns here, not generic advice.
  #
  # Comment-only, never blocking, by design: AGENTS.md §6 rule 6 is "never self-merge," and this
  # job doesn't submit a review verdict, so nothing about it can approve a PR on its own.
  # `continue-on-error: true` matches the reviewdog annotation step above — a missing
  # ANTHROPIC_API_KEY secret or a transient API error must not red this check.
  claude-review:
    name: Claude Semantic Code Review (informational)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Claude Code Review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            Before assessing the diff, read .agents/AGENTS.md §6 and the lesson files it indexes
            under .agents/lessons/ — this repo's own catalog of real shipped bugs, each traced back
            from an actual defect. Flag anything in this diff that matches a documented failure
            pattern there, in addition to standard correctness, security, and edge-case review.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
