name: Android Release Bundle (smart-recipe-app)

# Trigger only; the build job is .github/workflows/_android-bundle.yml.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'projects/smart-recipe-app/**'
      - '.github/workflows/android-release-smart-recipe-app.yml'
      - '.github/workflows/_android-bundle.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'projects/smart-recipe-app/**'
      - '.github/workflows/android-release-smart-recipe-app.yml'
      - '.github/workflows/_android-bundle.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    uses: ./.github/workflows/_android-bundle.yml
    with:
      app: smart-recipe-app
    secrets: inherit
