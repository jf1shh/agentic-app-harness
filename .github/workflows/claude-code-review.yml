name: Claude Code Review

# Automatic Claude review posted on every PR — no @claude trigger needed.
# Requires the Claude GitHub App and an ANTHROPIC_API_KEY repository secret.
# See https://code.claude.com/docs/en/github-actions
on:
  pull_request:
    types: [opened, synchronize]
    branches: [ main, master ]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Post the review as a PR comment
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request and post your feedback as a PR comment.
            This is a Spec-Driven-Development monorepo — the binding rules live
            in AGENTS.md and .agents/AGENTS.md. Hold the diff to those rules and
            focus on:
            - Spec alignment: does the change match the relevant spec in specs/,
              and does it avoid "vibe coding" / undocumented architectural drift?
            - Contract-first Zod schemas for any new/changed data models, with
              validation at untrusted boundaries (storage, imports).
            - Correctness and obvious bugs.
            - Test coverage: Vitest units + Playwright E2E (BDD Given-When-Then)
              and @axe-core/playwright a11y for new behavior.
            - Any guardrail regressions called out in .agents/AGENTS.md §6.
            Be concise and constructive, and skip nitpicks that don't matter.
          # Read-only review: allow inspecting CI results and the diff, but the
          # action already scopes tools appropriately for review mode.
          claude_args: '--max-turns 15'
