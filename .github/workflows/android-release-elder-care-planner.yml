name: Android Release Bundle (elder-care-planner)

# Trigger only; the build job is .github/workflows/_android-bundle.yml.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'projects/elder-care-planner/**'
      - '.github/workflows/android-release-elder-care-planner.yml'
      - '.github/workflows/_android-bundle.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'projects/elder-care-planner/**'
      - '.github/workflows/android-release-elder-care-planner.yml'
      - '.github/workflows/_android-bundle.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    uses: ./.github/workflows/_android-bundle.yml
    with:
      app: elder-care-planner
      # Run the native regression tests alongside the release bundle.
      gradle_tasks: bundleRelease testReleaseUnitTest
    secrets: inherit
