name: Harness Testing Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-apps:
    runs-on: windows-latest
    strategy:
      # One leg per app, in parallel. fail-fast:false so one app's failure
      # doesn't cancel the others — you see every app's result in one run.
      fail-fast: false
      matrix:
        app: [mood-diner, portfolio-hub, travel-packing-app, smart-recipe-app, legal-financial-rag]

    name: test (${{ matrix.app }})
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: projects/${{ matrix.app }}/package-lock.json

      # test-app.ps1 is self-contained: it installs the app's deps and Playwright
      # browsers on demand, then runs security audit, lint, type-check, Vitest, and
      # Playwright E2E + axe a11y. No separate global install step needed.
      - name: Run Harness Suite for ${{ matrix.app }}
        shell: pwsh
        run: ./scripts/test-app.ps1 -AppName ${{ matrix.app }}
