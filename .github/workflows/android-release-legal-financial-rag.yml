name: Android Release Bundle (legal-financial-rag)

# Trigger only; the build job is .github/workflows/_android-bundle.yml.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'projects/legal-financial-rag/**'
      - '.github/workflows/android-release-legal-financial-rag.yml'
      - '.github/workflows/_android-bundle.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'projects/legal-financial-rag/**'
      - '.github/workflows/android-release-legal-financial-rag.yml'
      - '.github/workflows/_android-bundle.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bundle:
    uses: ./.github/workflows/_android-bundle.yml
    with:
      app: legal-financial-rag
    secrets: inherit
